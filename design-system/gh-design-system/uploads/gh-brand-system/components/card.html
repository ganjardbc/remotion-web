<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Components — Card</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding:48px; background:var(--color-surface-alt); }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; max-width:960px; margin:0 auto; }
</style>
</head>
<body>
<div class="grid">
  <div class="card">
    <div class="card-title">Card statis</div>
    <div class="card-body">Card dasar — background putih, border tipis, shadow halus.</div>
  </div>
  <div class="card card-interactive">
    <div class="card-title">Card interactive</div>
    <div class="card-body">Hover buat lihat elevasi naik + sedikit terangkat. Pakai <code>.card-interactive</code>.</div>
    <div class="card-footer"><span class="tag tag-accent">Baru</span></div>
  </div>
  <div class="card">
    <div class="card-title">Dengan footer</div>
    <div class="card-body">Card bisa punya footer buat tag, tombol, atau meta info.</div>
    <div class="card-footer">
      <button class="btn btn-outline" style="padding:8px 16px; font-size:14px;">Lihat</button>
    </div>
  </div>
</div>
</body>
</html>
