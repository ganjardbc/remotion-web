<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Components — Navbar</title>
<link rel="stylesheet" href="../styles.css">
<style> body { padding:0; } </style>
</head>
<body>
<nav class="navbar">
  <div class="navbar-brand">
    <div class="badge"><img src="../assets/gh-logo.png" alt="GH"></div>
    GH
  </div>
  <ul class="navbar-links">
    <li><a class="navbar-link is-active" href="#">Beranda</a></li>
    <li><a class="navbar-link" href="#">Konten</a></li>

      GH
    </div>

      <li><a class="navbar-link" href="#">Konten</a></li>

</html>
