<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Components — Button</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding:48px; }
  .wrap { max-width:900px; margin:0 auto; }
  .row { display:flex; gap:16px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .section-title { font-size:14px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--color-surface-text-muted); margin:32px 0 12px; }
  .on-ground.wrap-dark { padding:32px; border-radius:20px; margin-top:16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="section-title">Variants</div>
  <div class="row">
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-secondary">Secondary</button>
    <button class="btn btn-outline">Outline</button>
    <button class="btn btn-ghost">Ghost</button>
  </div>

  <div class="section-title">States — primary</div>
  <div class="row">
    <button class="btn btn-primary">Default</button>
    <button class="btn btn-primary" style="background:var(--color-accent-600)">Hover</button>
    <button class="btn btn-primary" style="background:var(--color-accent-700)">Active</button>
    <button class="btn btn-primary" style="box-shadow:var(--focus-ring)">Focus</button>
    <button class="btn btn-primary" disabled>Disabled</button>
  </div>

  <div class="section-title">On ground (dark) context</div>
  <div class="on-ground wrap-dark">
    <div class="row">
      <button class="btn btn-primary">Primary</button>
      <button class="btn btn-outline">Outline</button>
      <button class="btn btn-ghost">Ghost</button>
    </div>
  </div>

  <p style="margin-top:32px; color:var(--color-surface-text-muted); max-width:600px;">
    Semua variant berbagi shape (<code>.btn</code>) — cuma warna yang beda. Wrap tombol dalam <code>.on-ground</code> kalau taruh di atas background biru brand, biar outline &amp; ghost otomatis kebalik ke putih.
  </p>
</div>
</body>
</html>
