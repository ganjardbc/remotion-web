<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Components — Table</title>
<link rel="stylesheet" href="../styles.css">
<style> body{padding:48px;} .wrap{max-width:700px;} </style>
</head>
<body>
<div class="wrap">
  <table class="table">
    <thead>
      <tr><th>Nama</th><th>Status</th><th>Tanggal</th></tr>
    </thead>
    <tbody>
      <tr><td>Konten IG #1</td><td><span class="tag tag-accent">Draft</span></td><td>12 Sep 2026</td></tr>
      <tr><td>Konten TikTok #2</td><td><span class="tag" style="background:var(--color-success-bg); color:var(--color-success);">Published</span></td><td>10 Sep 2026</td></tr>
      <tr><td>Konten IG #3</td><td><span class="tag tag-outline">Review</span></td><td>9 Sep 2026</td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
