<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Components — Progress</title>
<link rel="stylesheet" href="../styles.css">
<style> body{padding:48px;} .wrap{max-width:420px; display:flex; flex-direction:column; gap:24px;} </style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="progress"><div class="progress-bar" style="width:35%"></div></div>
    <span class="caption" style="display:block; margin-top:6px;">35% — .progress-bar width diatur inline sesuai persen</span>
  </div>
  <div>
    <div class="progress"><div class="progress-bar" style="width:80%"></div></div>
    <span class="caption" style="display:block; margin-top:6px;">80%</span>
  </div>
  <div style="display:flex; align-items:center; gap:10px;">
    <div class="spinner"></div>
    <span class="body-text">.spinner — buat loading state singkat</span>
  </div>
</div>
</body>
</html>
