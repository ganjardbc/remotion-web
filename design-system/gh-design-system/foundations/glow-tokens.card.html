<!-- @dsCard group="Elevation" viewport="700x150" name="Glow" subtitle="Hover/focus emphasis. Blue by default, orange for the one highlight" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-body)}.row{display:flex;gap:16px}</style></head>
<body><div class="row">
<button class="btn btn-primary" style="box-shadow:var(--highlight-inset),var(--glow-primary)">--glow-primary</button>
<button class="btn btn-accent" style="box-shadow:var(--highlight-inset),var(--glow-accent)">--glow-accent</button>
<div class="card card-glow card-interactive" style="width:180px"><div class="card-title" style="font-size:16px">card-glow</div><div class="card-body" style="font-size:13px">Hover me</div></div>
</div></body></html>
