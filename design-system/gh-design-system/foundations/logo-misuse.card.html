<!-- @dsCard group="Brand" viewport="700x180" name="Logo misuse" subtitle="Never desaturate, stretch, recolor, or rotate" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-body)}.row{display:flex;gap:20px}.c{text-align:center;font-size:11px;color:var(--color-danger);width:120px}.badge{border-radius:999px;background:var(--gradient-brand);display:flex;align-items:center;justify-content:center;margin:0 auto 8px}.badge img{width:60%}</style></head>
<body><div class="row">
<div class="c"><div class="badge" style="width:70px;height:70px;filter:grayscale(1)"><img src="../assets/gh-logo.png"></div>Desaturated</div>
<div class="c"><div class="badge" style="width:100px;height:60px;border-radius:12px"><img src="../assets/gh-logo.png" style="width:80%"></div>Stretched</div>
<div class="c"><div class="badge" style="width:70px;height:70px;background:#000"><img src="../assets/gh-logo.png"></div>Recolored bg</div>
<div class="c"><div class="badge" style="width:70px;height:70px;transform:rotate(20deg)"><img src="../assets/gh-logo.png"></div>Rotated</div>
</div></body></html>
