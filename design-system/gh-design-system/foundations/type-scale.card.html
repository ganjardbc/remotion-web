<!-- @dsCard group="Type" viewport="700x280" name="Semantic type scale" subtitle="h1-h6, body, caption, overline" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-body)}.row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--color-surface-border);padding:8px 0}.meta{font-family:var(--font-mono);font-size:11px;color:var(--color-surface-text-muted);white-space:nowrap}</style></head>
<body>
<div class="row"><h1 style="font-size:36px">Heading one</h1><span class="meta">h1 — 56px / 700</span></div>
<div class="row"><h2 style="font-size:28px">Heading two</h2><span class="meta">h2 — 40px</span></div>
<div class="row"><h3 style="font-size:22px">Heading three</h3><span class="meta">h3 — 32px</span></div>
<div class="row"><h4>Heading four</h4><span class="meta">h4 — 24px</span></div>
<div class="row"><p class="body-lg">Body large — lead paragraph</p><span class="meta">.body-lg — 20px</span></div>
<div class="row"><p>Body default — general paragraph</p><span class="meta">p — 17px</span></div>
<div class="row"><span class="caption">Caption — small label under image/table</span><span class="meta">.caption — 13px</span></div>
<div class="row"><span class="overline">OVERLINE LABEL</span><span class="meta">.overline — uppercase, tracked</span></div>
</body></html>
