<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-body)}body{background:var(--color-surface-alt)}.row{display:flex;gap:20px}.c{background:#fff;border-radius:12px;padding:16px;width:140px;font-family:var(--font-mono);font-size:11px;color:var(--color-surface-text-muted)}</style></head>
<body><div class="row">
<div class="c" style="box-shadow:var(--shadow-sm)">--shadow-sm<br>static card</div>
<div class="c" style="box-shadow:var(--shadow-md)">--shadow-md<br>hover, popover</div>
<div class="c" style="box-shadow:var(--shadow-lg)">--shadow-lg<br>dropdown, toast</div>
<div class="c" style="box-shadow:var(--shadow-xl)">--shadow-xl<br>modal</div>
</div></body></html>
