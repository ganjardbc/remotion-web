<!-- @dsCard group="Spacing" viewport="700x220" name="Spacing scale" subtitle="One scale drives gap, margin, and padding everywhere" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-body)}.row{display:flex;align-items:center;gap:14px;margin-bottom:8px}.bar{background:var(--color-accent);height:14px;border-radius:3px}.lbl{width:150px;font-family:var(--font-mono);font-size:12px}</style></head>
<body>
<div class="row"><span class="lbl">--space-1 — 8px</span><div class="bar" style="width:8px"></div></div>
<div class="row"><span class="lbl">--space-2 — 12px</span><div class="bar" style="width:12px"></div></div>
<div class="row"><span class="lbl">--space-3 — 16px</span><div class="bar" style="width:16px"></div></div>
<div class="row"><span class="lbl">--space-4 — 24px</span><div class="bar" style="width:24px"></div></div>
<div class="row"><span class="lbl">--space-5 — 32px</span><div class="bar" style="width:32px"></div></div>
<div class="row"><span class="lbl">--space-6 — 48px</span><div class="bar" style="width:48px"></div></div>
<div class="row"><span class="lbl">--space-7 — 64px</span><div class="bar" style="width:64px"></div></div>
<div class="row"><span class="lbl">--space-8 — 96px</span><div class="bar" style="width:96px"></div></div>
</body></html>
