<!-- @dsCard group="Dark mode" viewport="700x260" name="Dark mode toggle" subtitle="Click to re-theme live — a third context, distinct from on-ground" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-body)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}</style></head>
<body>
<button class="btn btn-primary" onclick="document.body.classList.toggle('dark')">Toggle dark mode</button>
<div class="grid">
<div class="card"><div class="card-title" style="font-size:16px">Card</div><div class="card-body" style="font-size:13px">Depth via border and tint, not shadow.</div></div>
<div class="field"><label class="label">Input</label><input class="input" placeholder="Re-themes automatically"></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-self:start"><button class="btn btn-primary">Primary</button><button class="btn btn-accent">Accent</button><button class="btn btn-outline">Outline</button></div>
</div>
</body></html>
