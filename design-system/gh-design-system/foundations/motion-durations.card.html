<!-- @dsCard group="Motion" viewport="700x120" name="Durations" subtitle="Hover to feel the difference" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-body)}.row{display:flex;gap:16px}.b{padding:12px 20px;border-radius:8px;background:var(--color-primary-soft);color:var(--color-primary-text);border:none;font-family:var(--font-heading);font-weight:600;cursor:pointer}.b:hover{background:var(--color-primary);color:#fff}.f{transition:background-color 100ms var(--easing-standard),color 100ms var(--easing-standard)}.b2{transition:background-color 160ms var(--easing-standard),color 160ms var(--easing-standard)}.s{transition:background-color 240ms var(--easing-standard),color 240ms var(--easing-standard)}</style></head>
<body><div class="row">
<button class="b f">fast — 100ms</button>
<button class="b b2">base — 160ms</button>
<button class="b s">slow — 240ms</button>
</div></body></html>
